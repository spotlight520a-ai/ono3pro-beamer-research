<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ONO3Pro 自动校正四阶段构图示例</title>
  <desc id="desc">从画面歪斜、识别障碍、自动入幕到校正完成的四阶段示意。此图用于说明 Listing 图片叙事结构，不代表实拍性能或真实耗时。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset="1" stop-color="#edf3f8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7db7ef" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7db7ef" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#193e66"/>
      <stop offset=".55" stop-color="#255e8b"/>
      <stop offset="1" stop-color="#0f2b46"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#26394b" flood-opacity=".12"/>
    </filter>
    <style>
      .title{font:700 31px "Microsoft YaHei","PingFang SC",sans-serif;fill:#172231}
      .sub{font:400 15px "Microsoft YaHei","PingFang SC",sans-serif;fill:#5f6b7a}
      .step{font:700 12px "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:.08em;fill:#2b66d9}
      .label{font:700 17px "Microsoft YaHei","PingFang SC",sans-serif;fill:#172231}
      .note{font:400 12px "Microsoft YaHei","PingFang SC",sans-serif;fill:#5f6b7a}
      .tiny{font:400 11px "Microsoft YaHei","PingFang SC",sans-serif;fill:#697585}
    </style>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#bg)"/>
  <text x="48" y="58" class="title">自动校正：把四个动作连成一段结果</text>
  <text x="48" y="86" class="sub">从用户随手摆放后的真实问题开始，最后落在方正、完整、可观看的画面。</text>
  <rect x="950" y="38" width="202" height="32" rx="16" fill="#fff7e8" stroke="#eed9ad"/>
  <text x="1051" y="59" text-anchor="middle" class="note" fill="#8a5a12">构图示意 · 非性能实测</text>

  <g filter="url(#shadow)">
    <rect x="32" y="118" width="244" height="326" rx="14" fill="#fff" stroke="#dce4ec"/>
    <rect x="316" y="118" width="244" height="326" rx="14" fill="#fff" stroke="#dce4ec"/>
    <rect x="600" y="118" width="244" height="326" rx="14" fill="#fff" stroke="#dce4ec"/>
    <rect x="884" y="118" width="284" height="326" rx="14" fill="#fff" stroke="#dce4ec"/>
  </g>

  <g>
    <text x="56" y="148" class="step">STEP 01</text>
    <text x="56" y="176" class="label">画面歪斜</text>
    <rect x="56" y="194" width="196" height="128" rx="8" fill="#f2f5f8" stroke="#c6d0da"/>
    <path d="M77 207 231 216 218 306 86 295Z" fill="url(#screen)"/>
    <path d="M86 295 218 306 211 318 94 308Z" fill="#183a58" opacity=".45"/>
    <path d="M68 348h34M68 337v22M203 348h34M237 337v22" stroke="#9aa6b4" stroke-width="2"/>
    <path d="M64 359h184" stroke="#cdd5de" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="154" y="379" text-anchor="middle" class="note">画面边缘不平行</text>
    <path d="M62 419h54l8-20 5 31 9-17h50z" fill="#1c2430"/>
    <rect x="58" y="399" width="64" height="17" rx="7" fill="#252d38"/>
    <path d="M66 399c4-14 12-18 22-18s18 4 22 18" fill="none" stroke="#303946" stroke-width="4"/>
    <circle cx="73" cy="407" r="5" fill="#6ca8cf" stroke="#9ecae5" stroke-width="2"/>
    <path d="M128 414h82" stroke="url(#beam)" stroke-width="22"/>
  </g>

  <path d="M278 282h30" stroke="#aebac7" stroke-width="2"/>
  <path d="m304 275 8 7-8 7" fill="none" stroke="#aebac7" stroke-width="2"/>

  <g>
    <text x="340" y="148" class="step">STEP 02</text>
    <text x="340" y="176" class="label">发现障碍</text>
    <rect x="340" y="194" width="196" height="128" rx="8" fill="#f2f5f8" stroke="#c6d0da"/>
    <path d="M360 207 512 216 499 306 369 295Z" fill="url(#screen)"/>
    <rect x="440" y="214" width="58" height="75" rx="8" fill="#e4f4e9" stroke="#4a9c6b" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M467 287v-34m0 9c-16-17-25 0-10 10 8 5 12 8 12 8m0-20c13-15 22 0 8 9-6 4-8 7-8 7" fill="none" stroke="#318259" stroke-width="4" stroke-linecap="round"/>
    <circle cx="469" cy="252" r="24" fill="none" stroke="#56ad78" stroke-width="2" opacity=".55"/>
    <path d="M348 334h58l8-20 5 31 9-17h50z" fill="#1c2430"/>
    <rect x="344" y="314" width="64" height="17" rx="7" fill="#252d38"/>
    <path d="M352 314c4-14 12-18 22-18s18 4 22 18" fill="none" stroke="#303946" stroke-width="4"/>
    <circle cx="359" cy="322" r="5" fill="#6ca8cf" stroke="#9ecae5" stroke-width="2"/>
    <text x="438" y="379" class="note">识别遮挡与边界</text>
  </g>

  <path d="M562 282h30" stroke="#aebac7" stroke-width="2"/>
  <path d="m588 275 8 7-8 7" fill="none" stroke="#aebac7" stroke-width="2"/>

  <g>
    <text x="624" y="148" class="step">STEP 03</text>
    <text x="624" y="176" class="label">自动入幕</text>
    <rect x="624" y="194" width="196" height="128" rx="8" fill="#f2f5f8" stroke="#c6d0da"/>
    <rect x="652" y="202" width="140" height="112" rx="4" fill="#f9fbfd" stroke="#3d87c8" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M670 216h104v84H670Z" fill="url(#screen)"/>
    <path d="m655 210 12-12m8 0h-8v8M789 210l-12-12m-8 0h8v8M655 306l12 12m8 0h-8v-8M789 306l-12 12m-8 0h8v-8" fill="none" stroke="#2f81c4" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M632 334h58l8-20 5 31 9-17h50z" fill="#1c2430"/>
    <rect x="628" y="314" width="64" height="17" rx="7" fill="#252d38"/>
    <path d="M636 314c4-14 12-18 22-18s18 4 22 18" fill="none" stroke="#303946" stroke-width="4"/>
    <circle cx="643" cy="322" r="5" fill="#6ca8cf" stroke="#9ecae5" stroke-width="2"/>
    <text x="722" y="379" class="note">边缘向幕框靠拢</text>
  </g>

  <path d="M846 282h30" stroke="#aebac7" stroke-width="2"/>
  <path d="m872 275 8 7-8 7" fill="none" stroke="#aebac7" stroke-width="2"/>

  <g>
    <text x="908" y="148" class="step">STEP 04</text>
    <text x="908" y="176" class="label">校正完成</text>
    <rect x="908" y="194" width="236" height="128" rx="8" fill="#f2f5f8" stroke="#c6d0da"/>
    <rect x="938" y="206" width="176" height="104" rx="4" fill="#fbfdff" stroke="#c9d4df"/>
    <rect x="946" y="214" width="160" height="88" fill="url(#screen)"/>
    <path d="M965 279c21-31 42-32 62-10 17-23 36-18 59 10" fill="none" stroke="#73b9df" stroke-width="2" opacity=".5"/>
    <circle cx="1119" cy="206" r="21" fill="#dff6e9" stroke="#2b9163" stroke-width="2"/>
    <path d="m1109 206 7 7 14-15" fill="none" stroke="#247e57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M916 334h58l8-20 5 31 9-17h50z" fill="#1c2430"/>
    <rect x="912" y="314" width="64" height="17" rx="7" fill="#252d38"/>
    <path d="M920 314c4-14 12-18 22-18s18 4 22 18" fill="none" stroke="#303946" stroke-width="4"/>
    <circle cx="927" cy="322" r="5" fill="#6ca8cf" stroke="#9ecae5" stroke-width="2"/>
    <text x="1026" y="379" text-anchor="middle" class="note" fill="#247e57">方正、完整、可观看</text>
  </g>

  <rect x="32" y="466" width="1136" height="58" rx="10" fill="#fffdf7" stroke="#eadfc8"/>
  <path d="M52 495h16m-8-8v16" stroke="#a66a1c" stroke-width="2"/>
  <text x="80" y="491" class="note" fill="#6e4d1b">正式 Listing 素材建议用固定机位实拍替换本示意图：保留同一房间、同一摆放位置，按阶段截取画面。</text>
  <text x="80" y="509" class="tiny" fill="#7c6543">不要把本图当作自动校正耗时、避障成功率或入幕精度的实测证据；“3 秒”需另有可复核测试口径。</text>
</svg>
